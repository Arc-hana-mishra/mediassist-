<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MediAssist</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --surface: #131820;
    --surface2: #1a2130;
    --border: #1f2d3d;
    --teal: #00c9a7;
    --teal-dim: rgba(0,201,167,0.12);
    --teal-glow: rgba(0,201,167,0.25);
    --user-bubble: #1565c0;
    --text: #e8edf5;
    --muted: #6b7e96;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo-area { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, #00c9a7, #0080ff);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 0 14px var(--teal-glow);
  }
  .logo-text { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--teal); box-shadow: 0 0 6px var(--teal);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

  #messages {
    flex: 1; overflow-y: auto;
    padding: 20px 16px;
    display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 3px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg-row { display: flex; align-items: flex-end; gap: 8px; }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #00c9a7, #0080ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .bubble {
    max-width: 78%; padding: 12px 15px;
    border-radius: 18px; line-height: 1.55; font-size: 14.5px;
    animation: fadeUp .25s ease;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .bubble.bot { background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bubble.user { background: var(--user-bubble); border-bottom-right-radius: 4px; color: #fff; }
  .bubble.typing { display: flex; gap: 5px; align-items: center; padding: 14px 18px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
  .time { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .time.bot-time { padding-left: 38px; }
  .time.user-time { text-align: right; }
  .action-btns { display: flex; gap: 6px; padding-left: 38px; margin-top: 5px; }
  .action-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; border-radius: 20px;
    padding: 5px 12px; cursor: pointer; transition: all .2s;
    font-family: 'DM Sans', sans-serif;
  }
  .action-btn:hover { border-color: var(--teal); color: var(--teal); }
  .disclaimer {
    background: rgba(255,167,0,0.08); border: 1px solid rgba(255,167,0,0.2);
    border-radius: 10px; padding: 9px 13px; font-size: 12px;
    color: #ffc87a; text-align: center;
  }

  .bottom {
    flex-shrink: 0; background: var(--surface);
    border-top: 1px solid var(--border); padding: 12px 16px 16px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
  .chip {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 13px; font-size: 12.5px;
    cursor: pointer; transition: all .2s; color: var(--text);
    font-family: 'DM Sans', sans-serif;
  }
  .chip:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-dim); }
  .input-row { display: flex; gap: 10px; align-items: center; }
  #userInput {
    flex: 1; background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 14px; padding: 11px 15px; color: var(--text);
    font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none;
    transition: border-color .2s; resize: none; max-height: 100px; line-height: 1.4;
  }
  #userInput:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-dim); }
  #userInput::placeholder { color: var(--muted); }
  #sendBtn {
    width: 44px; height: 44px; background: var(--teal);
    border: none; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all .2s;
    box-shadow: 0 0 12px var(--teal-glow);
  }
  #sendBtn:hover { transform: scale(1.05); }
  #sendBtn:active { transform: scale(.96); }
  #sendBtn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  #sendBtn svg { fill: #0a0e14; }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <div class="logo-icon">⚕️</div>
    <span class="logo-text">MediAssist</span>
  </div>
  <div class="status-dot"></div>
</header>

<div id="messages">
  <div class="disclaimer">⚠️ For informational purposes only. Always consult a qualified healthcare professional.</div>
</div>

<div class="bottom">
  <div class="chips">
    <span class="chip" onclick="sendChip(this)">😣 Headache causes</span>
    <span class="chip" onclick="sendChip(this)">🌡️ Fever advice</span>
    <span class="chip" onclick="sendChip(this)">🔥 Inflammation</span>
    <span class="chip" onclick="sendChip(this)">💊 Daily vitamins</span>
    <span class="chip" onclick="sendChip(this)">⚡ Energy boost</span>
  </div>
  <div class="input-row">
    <textarea id="userInput" placeholder="Ask about symptoms, medications..." rows="1"></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
const SYSTEM = `You are MediAssist, a friendly medical information assistant. Provide helpful, accurate health information. Be concise (2-3 short paragraphs). Use plain language. Always remind users to see a doctor for personal medical decisions. Never diagnose or prescribe. Focus on education and wellness.`;

const history = [];

function now() {
  return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:true}).toLowerCase();
}

function addMsg(role, text) {
  document.getElementById('typing-indicator')?.remove();
  const msgs = document.getElementById('messages');

  const row = document.createElement('div');
  row.className = `msg-row ${role==='user'?'user':'bot'}`;
  if (role !== 'user') {
    const av = document.createElement('div');
    av.className = 'avatar'; av.textContent = '⚕️';
    row.appendChild(av);
  }
  const bubble = document.createElement('div');
  bubble.className = `bubble ${role==='user'?'user':'bot'}`;
  bubble.innerHTML = text.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  row.appendChild(bubble);
  msgs.appendChild(row);

  const t = document.createElement('div');
  t.className = `time ${role==='user'?'user-time':'bot-time'}`;
  t.textContent = role==='user' ? `You · ${now()}` : `MediAssist · ${now()}`;
  msgs.appendChild(t);

  if (role !== 'user') {
    const btns = document.createElement('div');
    btns.className = 'action-btns';
    const safe = text.replace(/"/g,'&quot;');
    btns.innerHTML = `<button class="action-btn" onclick="copyText(this)" data-text="${safe}">📋 Copy</button><button class="action-btn" onclick="document.getElementById('userInput').focus()">↩ Follow-up</button>`;
    msgs.appendChild(btns);
  }
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.id = 'typing-indicator'; row.className = 'msg-row bot';
  row.innerHTML = `<div class="avatar">⚕️</div><div class="bubble bot typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function copyText(btn) {
  navigator.clipboard.writeText(btn.dataset.text);
  btn.textContent = '✅ Copied';
  setTimeout(()=>btn.textContent='📋 Copy', 1500);
}

async function sendMessage(override) {
  const input = document.getElementById('userInput');
  const text = override || input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto';

  addMsg('user', text);
  history.push({role:'user', content: text});

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  showTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM,
        messages: history
      })
    });
    const data = await res.json();
    const reply = data.content?.map(b=>b.text||'').join('') || 'Please try again.';
    history.push({role:'assistant', content: reply});
    addMsg('bot', reply);
  } catch(e) {
    document.getElementById('typing-indicator')?.remove();
    addMsg('bot', 'Sorry, could not connect. Please check your internet and try again.');
  }
  btn.disabled = false;
}

function sendChip(el) {
  const text = el.textContent.replace(/^\S+\s/,'').trim();
  sendMessage(text);
}

document.getElementById('userInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});
document.getElementById('userInput').addEventListener('keydown', function(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

setTimeout(()=>{
  addMsg('bot', "Hello! 👋 I'm **MediAssist**, your personal health information guide.\n\nI can help with symptoms, medications, vitamins, and general wellness. What would you like to know?");
}, 400);
</script>
</body>
</html>
